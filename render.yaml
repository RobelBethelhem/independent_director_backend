# Render Blueprint — provisions the API web service + a free Postgres.
# In Render: New → Blueprint → connect this repo. Fill the `sync:false` vars when prompted.
services:
  - type: web
    name: independent-director-backend
    runtime: node
    region: oregon
    plan: free
    # --include=dev forces devDependencies (nest/tsc) even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "true"          # auto-creates the schema on first boot
      - key: DB_SSL
        value: "true"          # managed Postgres requires TLS
      # NOTE: OTP_DEV_MODE is intentionally NOT set here. It echoes verification
      # codes in API responses and is hard-disabled in production by the app
      # (see config/configuration.ts) — configure SMTP_* below to send real codes.
      - key: DATABASE_URL
        fromDatabase:
          name: zemen-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # ---- Fill these in the Render dashboard ----
      - key: FRONTEND_ORIGIN     # your Vercel URL, e.g. https://zemen-portal.vercel.app
        sync: false
      - key: SEED_ADMIN_EMAIL    # initial admin login (e.g. admin@zemen.test)
        sync: false
      - key: SEED_ADMIN_PASSWORD # initial admin password
        sync: false
      # ---- Email (Gmail or any SMTP). Without these, OTP/emails are logged, not sent ----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # ---- Object storage for document uploads (Cloudflare R2 / AWS S3). Optional ----
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false

databases:
  - name: zemen-db
    plan: free
    databaseName: zemen
    user: zemen
